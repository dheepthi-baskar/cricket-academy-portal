spring:
  application:
    name: cricket-academy-portal
  datasource:
    url: jdbc:h2:mem:cricket;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: 8080

jwt:
  secret: "ChangeMeInProduction_ChangeMeInProduction_ChangeMeInProduction_32bytesmin!!"
  expiration-ms: 86400000

academy:
  notifications:
    enabled: true

logging:
  level:
    com.cricketacademy: INFO
